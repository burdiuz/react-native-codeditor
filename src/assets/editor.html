<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .cm-editor { height: 100%; }
    .cm-scroller { overflow: auto; }
  </style>
</head>
<body></body>
<script>
  // Renders a fixed banner visible on the physical device — useful when
  // Chrome remote debugging is unavailable (e.g. emulator + Metro combo).
  const _showOnScreen = (color, msg) => {
    try {
      const div = document.createElement('div');
      div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:' + color + ';color:#fff;padding:6px 8px;font-size:11px;z-index:9999;word-break:break-all;white-space:pre-wrap;font-family:monospace;';
      div.textContent = msg;
      (document.body || document.documentElement).appendChild(div);
    } catch(e) {}
  };

  // Out-of-band postMessage used for log/error/ready signals that bypass DDA.
  // Falls back to window.postMessage when ReactNativeWebView is absent (browser preview).
  const _rnPost = (type, data) => {
    const msg = JSON.stringify({ type, data });
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(msg);
    } else {
      try { window.top.postMessage(msg, '*'); } catch(e) {}
      try { window.postMessage(msg, '*'); } catch(e) {}
    }
  };

  window.onerror = (message, source, lineno, colno) => {
    _showOnScreen('#c0392b', 'ERROR: ' + message + '\n' + source + ':' + lineno);
    _rnPost('__editorError__', { message, source, lineno, colno });
  };

  window.addEventListener('unhandledrejection', (event) => {
    const msg = String(event.reason);
    _showOnScreen('#c0392b', 'UNHANDLED: ' + msg);
    _rnPost('__editorError__', { message: msg, source: 'unhandledrejection' });
  });

  window.log = (...args) => _rnPost('__editorLog__', args);
  window._rnPost = _rnPost;
  window._showOnScreen = _showOnScreen;
</script>
<script src="./webview-interface.umd.js"></script>
<script src="./codemirror-editor.umd.js"></script>
<script>
(async function() {
  try {

    const {
      configure, createEditor, requireAsyncModule,
      registerLanguage, registerTaggedTemplate, registerSupportExtension,
    } = window.CodeMirrorEditor;

    // Maps theme name → [packageSuffix, exportName] for themes in multi-export packages.
    // Single-export packages (darcula, monokai, etc.) export under the same name as the package.
    const _themePackageMap = {
      githubDark:    ['github',    'githubDark'],
      githubLight:   ['github',    'githubLight'],
      vscodeDark:    ['vscode',    'vscodeDark'],
      xcodeDark:     ['xcode',     'xcodeDark'],
      xcodeLight:    ['xcode',     'xcodeLight'],
      solarizedDark: ['solarized', 'solarizedDark'],
      solarizedLight:['solarized', 'solarizedLight'],
      tokyoNight:    ['tokyo-night', 'tokyoNight'],
    };

    // fetch() is blocked for file:// origins even when same-origin in Android WebView.
    // XHR works; status 0 means success for file:// (no HTTP status in that context).
    configure({
      loader: (url) => new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url);
        xhr.onload = () => {
          if (xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)) {
            resolve(xhr.responseText);
          } else {
            reject(new Error('Failed to load ' + url + ': HTTP ' + xhr.status));
          }
        };
        xhr.onerror = () => reject(new Error('Failed to load ' + url));
        xhr.send();
      }),
    });

    // Assigned to window to prevent Chromium's GC from collecting it.
    // DDA's ResourcePool holds resources weakly (WeakValueMap + FinalizationRegistry);
    // without a strong reference from a long-lived scope, the GC would clean up the
    // resource and all subsequent HOST calls would fail with "Resource does not exist".
    const editorTarget = window._editorRoot = {};

    const { root: nativeApi } = await WebViewInterface.initializeGuest({
      root: editorTarget,
      handshakeTimeout: 30000,
      handshakeInterval: 200,
    });

    const config = await nativeApi.getInitialConfig();

    const extensions = config.extensions ?? [];

    // Custom language packages must be registered before createEditor resolves
    // config.language, otherwise e.g. language: 'sksl' would throw.
    for (const [name, packageName] of Object.entries(config.languages ?? {})) {
      registerLanguage(name, packageName);
    }

    const editor = await createEditor({
      parent: document.body,
      doc: config.content ?? '',
      language: config.language,
      languageConfig: config.languageConfig,
      embeds: config.embeds,
      extensions,
      onChange: (() => {
        let _timer = null;
        return () => {
          clearTimeout(_timer);
          _timer = setTimeout(() => {
            const cmds = requireAsyncModule('@codemirror/commands');
            const state = editor.view.state;
            _rnPost('__contentChange__', {
              value: state.doc.toString(),
              undo: cmds.undoDepth(state),
              redo: cmds.redoDepth(state),
            });
          }, 300);
        };
      })(),
    });

    // Pre-fetch commands from cache (core bundle already loaded by createEditor).
    const {
      undo, redo, undoDepth, redoDepth,
      indentMore, indentLess,
      toggleComment, moveLineUp, moveLineDown, deleteLine,
      selectLine, selectParentSyntax,
    } = await requireAsyncModule('@codemirror/commands');
    const { EditorView } = await requireAsyncModule('@codemirror/view');

    // Separate compartment for the theme so setTheme and setExtensions never clobber each other.
    // appendConfig adds it to the live state; themeCompartment.reconfigure() updates it in-place.
    const { Compartment, StateEffect, Transaction, Prec } = await requireAsyncModule('@codemirror/state');
    const themeCompartment = new Compartment();
    editor.view.dispatch({ effects: StateEffect.appendConfig.of(themeCompartment.of([])) });

    // Load and apply a theme by name.
    const _applyTheme = async (themeName) => {
      if (!themeName || themeName === 'default') {
        editor.view.dispatch({ effects: themeCompartment.reconfigure([]) });
        return;
      }
      const spec = _themePackageMap[themeName];
      const pkgSuffix = spec ? spec[0] : themeName;
      const exportName = spec ? spec[1] : themeName;
      const mod = await requireAsyncModule(`@uiw/codemirror-theme-${pkgSuffix}`);
      editor.view.dispatch({ effects: themeCompartment.reconfigure(mod[exportName]) });
    };

    if (config.theme) {
      await _applyTheme(config.theme);
    }

    // Autocomplete + bracket closing
    const {
      autocompletion, closeBrackets,
      closeBracketsKeymap, completionKeymap,
      startCompletion,
    } = await requireAsyncModule('@codemirror/autocomplete');
    const { keymap } = await requireAsyncModule('@codemirror/view');

    const { EditorState } = await requireAsyncModule('@codemirror/state');
    const { language: languageFacet } = await requireAsyncModule('@codemirror/language');

    let _customCompletions = [];

    // Static list set via setCompletions(). Registered as language data (not as
    // autocompletion({ override })) so it is merged with the language's own sources —
    // including nested-language ones (tagged-template embeds, Tailwind, React Native).
    // An `override` would replace every one of those and make embedded DSLs unsuggestable.
    const _customCompletionSource = (context) => {
      if (!_customCompletions.length) return null;
      // Inside an embedded language (sql`...`, sksl`...`) the static JS list is noise.
      const lang = context.state.facet(languageFacet);
      if (lang && !lang.isActiveAt(context.state, context.pos, -1)) return null;
      const word = context.matchBefore(/\w+/);
      if (!word || (word.from === word.to && !context.explicit)) return null;
      return { from: word.from, options: _customCompletions, validFor: /^\w*$/ };
    };

    editor.view.dispatch({
      effects: StateEffect.appendConfig.of([
        closeBrackets(),
        autocompletion({ activateOnTyping: true }),
        EditorState.languageData.of(() => [{ autocomplete: _customCompletionSource }]),
        keymap.of([...closeBracketsKeymap, ...completionKeymap]),
      ]),
    });

    // Compartment for shortcuts registered from the React Native side at runtime.
    const shortcutCompartment = new Compartment();
    editor.view.dispatch({ effects: StateEffect.appendConfig.of(Prec.highest(shortcutCompartment.of([]))) });

    const _registeredShortcuts = new Map();
    const _updateShortcutKeymap = () => {
      const entries = Array.from(_registeredShortcuts.entries()).map(([key, name]) => ({
        key,
        run: () => { _rnPost('__shortcut__', name); return true; },
      }));
      editor.view.dispatch({ effects: shortcutCompartment.reconfigure(keymap.of(entries)) });
    };

    // Spread EditorController methods directly — getValue, setValue, setLanguage,
    // setExtensions, loadExtension, destroy — then add methods not in EditorController.
    const { getValue, setValue, setLanguage, setExtensions, loadExtension, destroy } = editor;

    // Rebuilds the editor state around `doc` with an empty undo history (an unrecorded transaction
    // only hides a change from the history — earlier entries stay and get mapped over it, so Undo
    // would still walk back into the previous document). The live extension set is kept: the new
    // state is built from the current config and the compartments' contents are re-applied.
    const _replaceStateFresh = (doc, selection) => {
      const view = editor.view;
      const old = view.state;
      view.setState(EditorState.create({ doc, selection, extensions: old.config.base }));
      const effects = [];
      old.config.compartments.forEach((ext, comp) => effects.push(comp.reconfigure(ext)));
      if (effects.length) view.dispatch({ effects });
      const state = view.state;
      _rnPost('__contentChange__', {
        value: state.doc.toString(),
        undo: undoDepth(state),
        redo: redoDepth(state),
      });
    };

    // Dry-runs every undo and redo step on a throw-away copy of `state`. A history that does not
    // match its document makes CodeMirror throw "Applying change set to a document with the wrong
    // length" on the user's first Undo; catching that here keeps it from ever reaching the user.
    const _historyConsistent = (state) => {
      try {
        let s = state;
        const step = (tr) => { s = tr.state; };
        for (let i = 0; i < 1000 && undo({ state: s, dispatch: step }); i++);
        for (let i = 0; i < 1000 && redo({ state: s, dispatch: step }); i++);
        return s.doc.eq(state.doc);
      } catch (e) {
        return false;
      }
    };

    Object.assign(editorTarget, {
      getValue,
      setValue: (value) => {
        const { doc, selection } = editor.view.state;
        editor.view.dispatch({
          changes: { from: 0, to: doc.length, insert: value ?? '' },
          selection: {
            anchor: Math.min(selection.main.anchor, (value ?? '').length),
            head: Math.min(selection.main.head, (value ?? '').length),
          },
        });
      },
      // DDA serialises positional `undefined` arguments as `null`. Language factories only
      // default their options for `undefined`, so lang-markdown/lang-sql throw on `null`
      // (swallowed by the resolver as "No language support found") — normalise it back.
      setLanguage: (name, config, embeds) => setLanguage(name, config ?? undefined, embeds ?? undefined),
      setExtensions,
      loadExtension,
      destroy,

      // Serializable snapshot of the whole editor state: document, selection, undo/redo
      // history and scroll offset. Pair with restoreState() to move a document in and out
      // of this editor without losing its history.
      saveState: async () => {
        const { historyField } = await requireAsyncModule('@codemirror/commands');
        return {
          state: editor.view.state.toJSON({ history: historyField }),
          scrollTop: editor.view.scrollDOM.scrollTop,
          scrollLeft: editor.view.scrollDOM.scrollLeft,
        };
      },

      // Replaces the editor's state with a snapshot from saveState(). The live extension set
      // (language, theme, shortcuts, completions...) is kept: the new state is built from the
      // current config and the compartments' current contents are re-applied. Set the desired
      // language/theme BEFORE calling this. Notifies the host like a regular content change.
      restoreState: async (snapshot) => {
        const { historyField } = await requireAsyncModule('@codemirror/commands');
        const old = editor.view.state;
        const next = EditorState.fromJSON(
          snapshot.state,
          { extensions: old.config.base },
          { history: historyField }
        );
        if (!_historyConsistent(next)) {
          console.warn('restoreState: snapshot history does not match its document, restoring text only');
          _replaceStateFresh(next.doc, next.selection);
          editor.view.scrollDOM.scrollTop = snapshot.scrollTop ?? 0;
          editor.view.scrollDOM.scrollLeft = snapshot.scrollLeft ?? 0;
          return;
        }
        editor.view.setState(next);
        const effects = [];
        old.config.compartments.forEach((ext, comp) => effects.push(comp.reconfigure(ext)));
        if (effects.length) editor.view.dispatch({ effects });
        editor.view.scrollDOM.scrollTop = snapshot.scrollTop ?? 0;
        editor.view.scrollDOM.scrollLeft = snapshot.scrollLeft ?? 0;
        const state = editor.view.state;
        _rnPost('__contentChange__', {
          value: state.doc.toString(),
          undo: undoDepth(state),
          redo: redoDepth(state),
        });
      },

      // Maps a language name to a package that doesn't follow the
      // @codemirror/lang-{name} convention. Takes effect on the next setLanguage().
      registerLanguage: (name, packageName) => registerLanguage(name, packageName),

      // Imperative counterpart to createEditor's `embeds` option — registers a
      // tagged-template DSL embedding / support-extension package globally (for
      // the lifetime of this page), picked up by any subsequent
      // setLanguage('javascript', ...) call. See js-codemirror-package's
      // registerTaggedTemplate/registerSupportExtension for package shape.
      registerTaggedTemplate: (packageName) => registerTaggedTemplate(packageName),
      registerSupportExtension: (packageName, supportConfig) =>
        registerSupportExtension(packageName, supportConfig),

      // Replaces the document AND empties the undo history. It is a different document, and setState()
      // keeps the previous one's scroll offsets, so they are reset too.
      resetValue: (value) => {
        _replaceStateFresh(value ?? '');
        editor.view.scrollDOM.scrollTop = 0;
        editor.view.scrollDOM.scrollLeft = 0;
      },

      setTheme: (themeName) => _applyTheme(themeName),

      setFontSize: (size) => {
        editor.view.dom.style.fontSize = size ? size + 'px' : '';
        requestAnimationFrame(() => {
          const { head } = editor.view.state.selection.main;
          editor.view.dispatch({
            effects: EditorView.scrollIntoView(head, { y: 'center' }),
          });
        });
      },

      setViewport: (options) => {
        const {
          intialScale = 1,
          maximumScale,
          minimumScale,
          userScalable,
          viewportWidth,
        } = options ?? {};
        let content = 'width=' + (viewportWidth ?? 'device-width') + ', initial-scale=' + intialScale;
        if (maximumScale !== undefined) content += ', maximum-scale=' + maximumScale;
        if (minimumScale !== undefined) content += ', minimum-scale=' + minimumScale;
        if (userScalable !== undefined)
          content += ', user-scalable=' + (userScalable ? 'yes' : 'no');
        let meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', content);
      },

      focus: () => editor.view.focus(),

      getCursor: (where) => {
        const state = editor.view.state;
        const sel = state.selection.main;
        const pos =
          where === 'from' ? sel.from : where === 'to' ? sel.to : sel.head;
        const line = state.doc.lineAt(pos);
        return { line: line.number - 1, ch: pos - line.from, index: pos };
      },

      setCursor: (line, ch) => {
        const view = editor.view;
        const lineObj = view.state.doc.line(line + 1);
        const pos = lineObj.from + (ch ?? 0);
        view.dispatch({ selection: { anchor: pos } });
      },

      getSelection: () => {
        const state = editor.view.state;
        return state.sliceDoc(state.selection.main.from, state.selection.main.to);
      },

      setSelection: (anchor, head) => {
        editor.view.dispatch({ selection: { anchor, head: head ?? anchor } });
      },

      replaceSelection: (text) => {
        const view = editor.view;
        view.dispatch(view.state.replaceSelection(text));
      },

      cancelSelection: () => {
        const view = editor.view;
        const { head } = view.state.selection.main;
        view.dispatch({ selection: { anchor: head } });
      },

      indentMore: () => indentMore(editor.view),

      indentLess: () => indentLess(editor.view),

      toggleComment: () => toggleComment(editor.view),

      moveLineUp: () => moveLineUp(editor.view),

      moveLineDown: () => moveLineDown(editor.view),

      deleteLine: () => deleteLine(editor.view),

      selectLine: () => selectLine(editor.view),

      selectParentSyntax: () => selectParentSyntax(editor.view),

      historyUndo: () => undo(editor.view),

      historyRedo: () => redo(editor.view),

      // Empties the undo/redo history, keeping the document and selection.
      historyClear: () => {
        const { doc, selection } = editor.view.state;
        _replaceStateFresh(doc, selection);
      },

      startCompletion: () => startCompletion(editor.view),

      setCompletions: (items) => {
        _customCompletions = Array.isArray(items) ? items : [];
      },

      setSoftKeyboard: (enabled) => {
        const dom = editor.view.contentDOM;
        if (enabled) {
          dom.removeAttribute('inputmode');
        } else {
          dom.setAttribute('inputmode', 'none');
        }
      },

      historySize: () => {
        const state = editor.view.state;
        return { undo: undoDepth(state), redo: redoDepth(state) };
      },

      scrollToCursor: (margin) => {
        const view = editor.view;
        const { head } = view.state.selection.main;
        view.dispatch({
          effects: EditorView.scrollIntoView(head, margin !== undefined ? { y: 'center' } : {}),
        });
      },

      registerShortcut: (key, name) => {
        _registeredShortcuts.set(key, name);
        _updateShortcutKeymap();
      },

      unregisterShortcut: (key) => {
        _registeredShortcuts.delete(key);
        _updateShortcutKeymap();
      },
    });

    if (config.viewport) {
      editorTarget.setViewport(config.viewport);
    }

    // Fire __selectionChange__ out-of-band whenever the user changes the selection.
    // React Native stores the last known selection so it can be read synchronously
    // (getSelection() via DDA fails after WebView loses focus on mobile).
    editor.view.dispatch({
      effects: StateEffect.appendConfig.of(
        EditorView.updateListener.of((update) => {
          if (update.selectionSet) {
            const sel = update.state.selection.main;
            const text = sel.empty ? '' : update.state.sliceDoc(sel.from, sel.to);
            _rnPost('__selectionChange__', text);
          }
        })
      ),
    });

    // Signal HOST that the editor is fully ready (theme and language applied).
    // WebViewAPI.onMessage intercepts this and fires onInitialized, which removes the BlockingView.
    _rnPost('__editorReady__', null);
  } catch (err) {
    _rnPost('__editorError__', { message: String(err), stack: err?.stack, source: 'bootstrap-catch' });
    _showOnScreen('#c0392b', 'bootstrap error: ' + String(err));
  }
})();
</script>
</html>
